name: freshcart_mobile
description: "FreshCart - Modern Online Grocery Shopping Mobile Application"
publish_to: 'none'
version: 1.0.0+1

environment:
  sdk: ^3.5.0
  flutter: ">=3.24.0"

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8

  # State Management
  flutter_riverpod: ^2.6.1

  # Routing & Navigation
  go_router: ^14.8.1

  # Networking & Serialization
  dio: ^5.8.0+1

  # Secure Token & Local Storage
  flutter_secure_storage: ^9.2.4
  shared_preferences: ^2.5.2

  # UI & Design Utilities
  google_fonts: ^6.2.1
  cached_network_image: ^3.4.1
  shimmer: ^3.0.0
  intl: ^0.20.2
  smooth_page_indicator: ^1.2.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^5.0.0
  mocktail: ^1.0.4
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true
