version: '3.8'

services:
  postgres:
    image: postgres:16-alpine
    container_name: freshcart_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres_secure_password
      POSTGRES_DB: freshcart_db
    ports:
      - "5432:5432"
    volumes:
      - freshcart_pgdata:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d freshcart_db"]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-01-18T22-51-28Z
    container_name: freshcart_minio
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minio_admin
      MINIO_ROOT_PASSWORD: minio_secret_password
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - freshcart_miniodata:/data

  backend:
    build:
      context: ../backend
      dockerfile: Dockerfile
    container_name: freshcart_backend
    restart: unless-stopped
    environment:
      NODE_ENV: development
      PORT: 4000
      DATABASE_URL: "postgresql://postgres:postgres_secure_password@postgres:5432/freshcart_db?schema=public"
      JWT_SECRET: freshcart_jwt_access_secret_super_secure_key_2026_dev
      JWT_EXPIRATION: 15m
      JWT_REFRESH_SECRET: freshcart_jwt_refresh_secret_ultra_secure_key_2026_dev
      JWT_REFRESH_EXPIRATION: 30d
      S3_ENDPOINT: "http://minio:9000"
      AWS_ACCESS_KEY_ID: minio_admin
      AWS_SECRET_ACCESS_KEY: minio_secret_password
      AWS_BUCKET_NAME: freshcart-media
    ports:
      - "4000:4000"
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - ../backend:/app
      - /app/node_modules

volumes:
  freshcart_pgdata:
  freshcart_miniodata:
